{% extends "base.html" %}

{% block title %}Register New Account - PlantaSanitus🌿{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;" class="glass-card">
  <h2 style="text-align: center; margin-bottom: 0.5rem;" data-i18n="nav_register">Create New Account</h2>
  <p style="text-align: center; color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">
    Select your role: Farmer (Crop Healthcare & Buying) or Agro-Medicine Seller
  </p>

  <form method="POST" action="/register">
    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_role">Select Account Role</label>
      <select name="role" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-primary); border-radius: var(--radius-sm); color: var(--accent-mint); font-weight: 700;">
        <option value="farmer">👨‍🌾 Farmer (Leaf Diagnostics, Soil Health & Buying)</option>
        <option value="seller">🏬 Agro-Medicine Seller (List Products & Manage Orders)</option>
        <option value="admin">🛡 System Admin (Platform Management)</option>
      </select>
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_username">Username</label>
      <input type="text" name="username" required placeholder="Choose unique username" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_email">Email Address</label>
      <input type="email" name="email" required placeholder="name@example.com" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_fullname">Full Name / Organization</label>
      <input type="text" name="full_name" placeholder="e.g. Rajesh Kumar / AgroCare Chemicals" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_phone">Phone Number</label>
      <input type="text" name="phone" placeholder="+91 9876543210" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;" data-i18n="lbl_password">Password</label>
      <input type="password" name="password" required placeholder="Choose secure password" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <button type="submit" class="btn-primary">
      <span data-i18n="btn_register">Complete Registration</span>
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
    Already registered? <a href="/login" style="color: var(--accent-mint); font-weight: 600;" data-i18n="nav_login">Sign In</a>
  </div>
</div>
{% endblock %}
