{% extends "base.html" %}

{% block title %}My Account & Profile - PlantaSanitus🌿{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;" class="glass-card">
  <h2>Account Profile Manager</h2>
  <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Manage your user account credentials and role details.</p>

  <form method="POST" action="/account">
    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Username (Read Only)</label>
      <input type="text" value="{{ user.username }}" disabled style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-dim);">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Account Role</label>
      <input type="text" value="{{ user.role|capitalize }}" disabled style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--accent-mint); font-weight: bold;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Full Name / Organization</label>
      <input type="text" name="full_name" value="{{ user.full_name or '' }}" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Email Address</label>
      <input type="email" name="email" value="{{ user.email }}" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Phone Number</label>
      <input type="text" name="phone" value="{{ user.phone or '' }}" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <button type="submit" class="btn-primary">
      <span>Update Profile Details</span>
    </button>
  </form>
</div>
{% endblock %}
